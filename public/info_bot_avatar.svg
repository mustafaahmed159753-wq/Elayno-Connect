<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="44" fill="#090d16" />

  <!-- Outer Pulse Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Inner Tech Disc -->
  <circle cx="100" cy="100" r="70" fill="url(#infoGrad)" />

  <!-- Dark Inner Core -->
  <circle cx="100" cy="100" r="54" fill="#090d16" opacity="0.92" />

  <!-- Hospital Cross Element in Background -->
  <path d="M92 56 H108 V76 H128 V92 H108 V112 H92 V92 H72 V76 H92 Z" fill="#06b6d4" opacity="0.25" />

  <!-- Stylized Information 'i' and Medical Pulse Symbol -->
  <!-- 'i' Dot -->
  <circle cx="100" cy="74" r="8" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- 'i' Stem / Stethoscope Curve -->
  <path d="M94 92 C94 90 96 89 100 89 C104 89 106 90 106 92 V128 C106 132 110 134 114 134" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pulse Line Accent -->
  <path d="M72 136 L86 136 L92 126 L98 144 L104 130 L110 136 L128 136" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Badge Border Orbiting Dots -->
  <circle cx="100" cy="18" r="4" fill="#38bdf8" />
  <circle cx="182" cy="100" r="4" fill="#34d399" />
  <circle cx="100" cy="182" r="4" fill="#38bdf8" />
  <circle cx="18" cy="100" r="4" fill="#34d399" />
</svg>
